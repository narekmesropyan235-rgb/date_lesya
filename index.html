<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для Леси ❤️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        .card {
            background: #ffffff;
            border-radius: 2rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
        }
        .btn-run {
            transition: transform 0.1s ease;
            position: relative;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 overflow-hidden">

    <div class="card w-full max-w-sm p-6 text-center relative z-10" id="app-card">
        <div class="text-xs text-gray-400 font-semibold mb-4" id="step-indicator">1/3</div>

        <div id="content-container">
            <!-- Шаг 1 -->
            <div class="step-content" data-step="1">
                <h2 class="text-xl font-bold text-gray-800 mb-6">Ты не против познакомиться с хорошим парнем?</h2>
                <div class="flex flex-col gap-3">
                    <button onclick="nextStep()" class="w-full bg-rose-500 hover:bg-rose-600 text-white font-medium py-3 rounded-xl shadow-md transition">Не против</button>
                    <button id="run-btn-1" class="btn-run w-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium py-3 rounded-xl shadow-sm">Против</button>
                </div>
            </div>

            <!-- Шаг 2 -->
            <div class="step-content hidden" data-step="2">
                <h2 class="text-xl font-bold text-gray-800 mb-6">А ты будешь моей будущей женой (и мамой 3 детей)?</h2>
                <div class="flex flex-col gap-3">
                    <button onclick="nextStep()" class="w-full bg-rose-500 hover:bg-rose-600 text-white font-medium py-3 rounded-xl shadow-md transition">Буду</button>
                    <button id="run-btn-2" class="btn-run w-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium py-3 rounded-xl shadow-sm">Не буду</button>
                </div>
            </div>

            <!-- Шаг 3 -->
            <div class="step-content hidden" data-step="3">
                <h2 class="text-xl font-bold text-gray-800 mb-6">Вы уверены что хотите со мной общаться?</h2>
                <div class="flex flex-col gap-3">
                    <button onclick="finishApp()" class="w-full bg-rose-500 hover:bg-rose-600 text-white font-medium py-3 rounded-xl shadow-md transition">Да</button>
                    <button id="run-btn-3" class="btn-run w-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium py-3 rounded-xl shadow-sm">Нет</button>
                </div>
            </div>

            <!-- Шаг 4: Финал -->
            <div class="step-content hidden" data-step="4">
                <div class="text-4xl mb-3">🎉</div>
                <h2 class="text-2xl font-bold text-gray-800 mb-2">Всё готово! ❤️</h2>
                <p class="text-gray-600 text-sm mb-6">Ждём подтверждения связи.</p>
                <div class="flex flex-col gap-3 relative" style="min-height: 120px;">
                    <button onclick="alert('Красавчик! Ловушка сработала 😉')" class="w-full bg-rose-500 hover:bg-rose-600 text-white font-medium py-3 rounded-xl shadow-md transition">Подтвердить</button>
                    <button id="run-btn-back" class="btn-run text-xs text-gray-400 hover:text-gray-600 py-2 absolute bottom-0 left-1/2 -translate-x-1/2">← Назад</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentStep = 1;

        function showStep(step) {
            document.querySelectorAll('.step-content').forEach(el => el.classList.add('hidden'));
            document.querySelector(`[data-step="${step}"]`).classList.remove('hidden');
            if (step <= 3) {
                document.getElementById('step-indicator').innerText = `${step}/3`;
            } else {
                document.getElementById('step-indicator').innerText = 'Готово';
            }
        }

        function nextStep() {
            currentStep++;
            if (currentStep <= 4) showStep(currentStep);
            if (currentStep === 4) {
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            }
        }

        function finishApp() {
            currentStep = 4;
            showStep(4);
            confetti({ particleCount: 150, spread: 90, origin: { y: 0.6 } });
        }

        function initRunningButton(btnId) {
            const btn = document.getElementById(btnId);
            if (!btn) return;

            const moveButton = () => {
                const x = (Math.random() - 0.5) * 160;
                const y = (Math.random() - 0.5) * 100;
                btn.style.transform = `translate(${x}px, ${y}px)`;
            };

            btn.addEventListener('mouseover', moveButton);
            btn.addEventListener('click', moveButton);
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                moveButton();
            });
        }

        initRunningButton('run-btn-1');
        initRunningButton('run-btn-2');
        initRunningButton('run-btn-3');
        initRunningButton('run-btn-back');

        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }
    </script>
</body>
</html>
